# 将静态内容部署到 GitHub Pages 标准化工作流
name: Deploy static content to Pages

# 触发条件：main分支推送 / 手动运行
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署必需完整权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只保留一个部署，取消正在运行的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 绑定 Pages 部署环境，缺少会导致 syncing_files 部署失败
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - name: Checkout source code
        uses: actions/checkout@v5

      # 安装 pnpm（使用新版 action，但保留项目当前稳定的安装行为）
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # 配置 Node 22（兼容 GitHub Actions 默认 Node24，无废弃告警）
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      # 安装项目依赖（lock文件严格匹配）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 项目打包构建
      - name: Build static assets
        run: pnpm run build

      # 打印dist目录，排查打包空目录问题
      - name: Check build dist files
        run: ls -la ./dist

      # Pages 环境配置
      - name: Configure Pages environment
        uses: actions/configure-pages@v6

      # 上传打包产物
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 执行 Pages 部署
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
